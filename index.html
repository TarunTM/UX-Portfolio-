<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/avatar.png" />
    <link rel="image_src" href="/avatar.jpg" />
    <title>Tarun Madan | Product Designer</title>
    <meta name="description" content="Product Designer specializing in high-conversion digital experiences, mobile applications, and intuitive interfaces." />
    
    <!-- WhatsApp & Open Graph Primary Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tarun Madan | Product Designer" />
    <meta property="og:description" content="Product Designer specializing in high-conversion digital experiences, mobile applications, and intuitive interfaces." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:secure_url" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tarun Madan — Product Designer" />

    <!-- Additional WhatsApp / Mobile Fallback Image -->
    <meta property="og:image" content="/avatar.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta itemprop="image" content="/avatar.jpg" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tarun Madan | Product Designer" />
    <meta name="twitter:description" content="Product Designer specializing in high-conversion digital experiences, mobile applications, and intuitive interfaces." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Google Fonts: Instrument Serif + Hanken Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Global background noise texture -->
    <svg id="texture" aria-hidden="true">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
